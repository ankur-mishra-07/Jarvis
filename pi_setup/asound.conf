# /etc/asound.conf — ALSA configuration for Jarvis on Raspberry Pi 5
# ReSpeaker 2-Mic HAT as default capture device
# Built-in 3.5mm headphone jack (or USB speaker) as default playback device
#
# To find your device numbers, run:
#   arecord -l    (lists capture devices)
#   aplay -l      (lists playback devices)
#
# Adjust the card numbers below if they differ on your system.
# Typically:
#   card 0 = bcm2835 headphones (3.5mm jack)
#   card 1 = seeed-2mic-voicecard (ReSpeaker HAT)
#
# If using a USB speaker instead of the 3.5mm jack, change pcm.!default
# playback card number to match the USB audio device.

# ---------------------------------------------------------------------------
# Default playback — 3.5mm headphone jack (bcm2835, usually card 0)
# ---------------------------------------------------------------------------
pcm.speaker {
    type hw
    card 0
    device 0
}

# Software volume control wrapper around the speaker
pcm.speaker_vol {
    type softvol
    slave.pcm "speaker"
    control {
        name "Jarvis Playback Volume"
        card 0
    }
    min_dB -40.0
    max_dB 0.0
}

# ---------------------------------------------------------------------------
# Default capture — ReSpeaker 2-Mic HAT (seeed-2mic-voicecard, usually card 1)
# ---------------------------------------------------------------------------
pcm.mic {
    type hw
    card 1
    device 0
}

# Downmix stereo capture to mono (speech recognition expects mono)
pcm.mic_mono {
    type route
    slave.pcm "mic"
    slave.channels 2
    ttable {
        0.0 0.5
        0.1 0.5
    }
}

# ---------------------------------------------------------------------------
# ALSA defaults — what applications use when no device is specified
# ---------------------------------------------------------------------------
pcm.!default {
    type asym
    playback.pcm "speaker_vol"
    capture.pcm "mic_mono"
}

ctl.!default {
    type hw
    card 0
}
